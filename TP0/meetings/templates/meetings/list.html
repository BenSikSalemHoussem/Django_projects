<h1>Meetings list</h1>
<ul>
    {% for element in meets %}
        <li>{{element.title}} : {{element.date}}</li>
                {% csrf_token %}
                <button><a href="{% url 'delMeet' element.id %}">Delete</a></button>
                <button><a href="{% url 'updateMeet' element.id %}">UPDATE</a></button>
            <br><br>
        {%empty%}
        <p>No meetings</p>
    {%endfor%}
</ul>
